<!DOCTYPE html>
<!-- login.html — Fake login page: enter name to save in localStorage and display in header -->
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirish — Topdik.uz</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="login.css">
</head>
<body data-page="login">
  <div id="header-container"></div>

  <main class="login-main">
    <div class="login-card" role="main">
      <div class="login-logo" aria-hidden="true">
        <span class="logo-top">TOP</span><span class="logo-dik">DIK</span><span class="logo-uz">.uz</span>
      </div>
      <h1 class="login-title">Kirish</h1>
      <p class="login-sub">Demo versiya: ismingizni kiriting</p>

      <!-- Already logged in state -->
      <div id="logged-in-state" style="display:none" class="logged-in-state">
        <div class="avatar" id="avatar-display" aria-hidden="true">A</div>
        <p class="logged-name" id="logged-name">Foydalanuvchi</p>
        <p class="logged-label">Siz tizimga kirgansiz</p>
        <button class="btn btn--outline btn--full" id="logout-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          Chiqish
        </button>
        <a href="index.html" class="btn btn--primary btn--full">Bosh sahifaga</a>
      </div>

      <!-- Login form -->
      <form id="login-form" class="login-form" novalidate aria-label="Login form">
        <div class="form-group">
          <label class="form-label" for="username">Ismingiz <span aria-hidden="true" style="color:var(--red)">*</span></label>
          <input type="text" id="username" class="form-input" 
                 placeholder="Masalan: Alisher"
                 maxlength="50" required aria-required="true"
                 autocomplete="name" autofocus>
          <span class="form-hint">Haqiqiy ism kiriting — salomlashish uchun ishlatiladi</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Telefon raqam</label>
          <input type="tel" id="phone" class="form-input" placeholder="+998 90 123 45 67"
                 autocomplete="tel">
          <span class="form-hint">Ixtiyoriy — faqat demo uchun</span>
        </div>

        <div class="form-error" id="login-error" role="alert" style="display:none"></div>

        <button type="submit" class="btn btn--primary btn--full btn--lg" id="login-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
          Kirish
        </button>

        <p class="login-disclaimer">
          Bu demo kirish. Haqiqiy autentifikatsiya yo'q — ism localStorage ga saqlanadi.
        </p>
      </form>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="main.js"></script>
  <script>
    function pageInit() {
      const user = getUser();

      if (user) {
        document.getElementById("login-form").style.display = "none";
        const loggedIn = document.getElementById("logged-in-state");
        loggedIn.style.display = "flex";
        document.getElementById("logged-name").textContent = user;
        document.getElementById("avatar-display").textContent = user.charAt(0).toUpperCase();

        document.getElementById("logout-btn").addEventListener("click", () => {
          localStorage.removeItem("td_user");
          location.reload();
        });
      }

      document.getElementById("login-form").addEventListener("submit", e => {
        e.preventDefault();
        const name = document.getElementById("username").value.trim();
        if (!name) {
          const err = document.getElementById("login-error");
          err.textContent = "⚠️ Ismingizni kiriting";
          err.style.display = "block";
          return;
        }
        localStorage.setItem("td_user", name);
        // Show success briefly then redirect
        const btn = document.getElementById("login-btn");
        btn.textContent = `✓ Xush kelibsiz, ${name}!`;
        btn.className = btn.className.replace("btn--primary","btn--success");
        setTimeout(() => window.location.href = "index.html", 1200);
      });
    }
  </script>
</body>
</html>
