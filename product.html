<!DOCTYPE html>
<!-- product.html — Single product detail page with full info, save and cart actions -->
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mahsulot — Topdik.uz</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="product.css">
</head>
<body data-page="product">
  <div id="header-container"></div>

  <main>
    <div class="container">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Bosh sahifa</a>
        <span aria-hidden="true">›</span>
        <a href="categories.html" id="bc-cat">Kategoriyalar</a>
        <span aria-hidden="true">›</span>
        <span id="bc-title" aria-current="page">Mahsulot</span>
      </nav>

      <div class="product-layout" id="product-layout" aria-live="polite">
        <!-- Rendered by JS -->
      </div>

      <section class="related-section" id="related-section" style="display:none">
        <h2 class="related-title">O'xshash e'lonlar</h2>
        <div class="products-grid" id="related-grid"></div>
      </section>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="main.js"></script>
  <script>
    function pageInit() {
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get("id"));
      const product = getAllProducts().find(p => p.id === id);

      if (!product) {
        document.getElementById("product-layout").innerHTML = `
          <div class="empty-state">
            <div class="empty-state__icon">😕</div>
            <h3>E'lon topilmadi</h3>
            <p><a href="index.html" class="btn btn--primary" style="margin-top:16px">Bosh sahifaga</a></p>
          </div>`;
        return;
      }

      document.title = `${product.title} — Topdik.uz`;
      document.getElementById("bc-cat").href = `categories.html?cat=${encodeURIComponent(product.category)}`;
      document.getElementById("bc-cat").textContent = product.category;
      document.getElementById("bc-title").textContent = product.title;

      const sv = isSaved(product.id);
      const ic = isInCart(product.id);

      document.getElementById("product-layout").innerHTML = `
        <div class="product-detail">
          <div class="product-detail__gallery">
            <img src="${product.img}" alt="${product.title}" class="product-detail__img" id="main-img">
            <div class="product-detail__thumbs">
              ${[product.img, product.img.replace(/\/seed\/[^/]+/, '/seed/alt1'), product.img.replace(/\/seed\/[^/]+/, '/seed/alt2')]
                .map((src, i) => `<img src="${src}&grayscale=${i>0?1:0}" alt="View ${i+1}" class="thumb${i===0?' active':''}" onclick="switchImg(this, '${src}&grayscale=0')">`).join("")}
            </div>
          </div>

          <div class="product-detail__info">
            <div class="product-detail__meta">
              <a href="categories.html?cat=${encodeURIComponent(product.category)}" class="product-card__cat">${product.category}</a>
            </div>
            <h1 class="product-detail__title">${product.title}</h1>
            <div class="product-detail__price">${formatPrice(product)}</div>
            <p class="product-detail__desc">${product.desc}</p>

            <div class="product-detail__seller">
              <div class="seller-avatar" aria-hidden="true">${product.user.charAt(0).toUpperCase()}</div>
              <div class="seller-info">
                <span class="seller-name">${product.user.replace(/_/g, ' ')}</span>
                <span class="seller-label">Sotuvchi</span>
              </div>
            </div>

            <div class="product-detail__actions">
              <button class="btn btn--primary btn--lg btn--full" id="cart-btn" onclick="handleDetailCart(${product.id})">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                ${ic ? '✓ Savatda' : 'Savatga qo\'shish'}
              </button>
              <button class="btn btn--outline btn--lg product-detail__save-btn${sv?' saved':''}" id="save-btn" onclick="handleDetailSave(${product.id})">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="${sv?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                ${sv ? 'Saqlangan' : 'Saqlash'}
              </button>
            </div>

            <div class="product-detail__contact">
              <button class="btn btn--ghost btn--full">📞 Telefon ko'rsatish</button>
            </div>
          </div>
        </div>`;

      // Related products
      const related = getAllProducts().filter(p => p.category === product.category && p.id !== product.id).slice(0, 4);
      if (related.length > 0) {
        const sec = document.getElementById("related-section");
        sec.style.display = "block";
        document.getElementById("related-grid").innerHTML = related.map(p => productCardHTML(p)).join("");
      }
    }

    function switchImg(thumb, src) {
      document.getElementById("main-img").src = src;
      document.querySelectorAll(".thumb").forEach(t => t.classList.remove("active"));
      thumb.classList.add("active");
    }

    function handleDetailCart(id) {
      addToCart(id);
      const btn = document.getElementById("cart-btn");
      btn.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg> ✓ Savatda`;
      btn.className = btn.className.replace("btn--primary","btn--success");
      updateBadges();
    }

    function handleDetailSave(id) {
      const added = toggleSaved(id);
      const btn = document.getElementById("save-btn");
      btn.classList.toggle("saved", added);
      const svg = btn.querySelector("svg");
      svg.setAttribute("fill", added ? "currentColor" : "none");
      btn.childNodes[btn.childNodes.length - 1].textContent = added ? " Saqlangan" : " Saqlash";
      updateBadges();
    }
  </script>
</body>
</html>
